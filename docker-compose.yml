services:
  db:
    image: postgres:15-alpine
    container_name: speech-sense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: speech-ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: speech-sense-web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/speech-ai"
      SECRET_KEY: "${SECRET_KEY}"
      WHISPER_MODEL_NAME: "base"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      MAX_UPLOAD_SIZE: "10485760"
      ALLOW_ALL_ORIGINS: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
  uploads:
