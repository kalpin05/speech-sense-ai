<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Speech AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;transition:.3s}
.container{max-width:950px;margin:auto;padding:20px}

h1{text-align:center;margin-bottom:20px}

.section{background:rgba(255,255,255,0.06);padding:18px;border-radius:16px;margin-bottom:18px;backdrop-filter:blur(10px);transition:.3s}
.section:hover{transform:scale(1.01)}
.section h3{margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

.switch{position:relative;width:50px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
input:checked + .slider{background:#38bdf8}
input:checked + .slider:before{transform:translateX(26px)}

select,input[type=range]{padding:6px;border-radius:8px;border:none}
.btn{width:100%;padding:10px;border:none;border-radius:10px;background:#38bdf8;font-weight:600;cursor:pointer;margin-top:8px}

.profile{text-align:center}
.profile img{width:75px;height:75px;border-radius:50%;margin-bottom:8px}

/* Light mode */
.light{background:#f1f5f9;color:#0f172a}
.light .section{background:white}

/* Toast */
.toast{position:fixed;bottom:-60px;left:50%;transform:translateX(-50%);background:#22c55e;color:black;padding:10px 20px;border-radius:10px;transition:.4s}
.toast.show{bottom:20px}

/* NAVBAR */
nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(15,23,42,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);z-index:1000}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:white;font-weight:600;font-size:1.1rem}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:#8fa5bc;font-size:0.9rem;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:#38bdf8}
.nav-right{display:flex;gap:15px;align-items:center}
.btn-logout{padding:8px 16px;background:transparent;border:1px solid #38bdf8;color:#38bdf8;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.btn-logout:hover{background:#38bdf8;color:#0f172a}
body{margin-top:60px}

</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-brand">🎯 SpeechAI</a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="exercises.html">Exercises</a>
    <a href="achievement-progress.html">Progress</a>
    <a href="settings.html" class="active">Settings</a>
  </div>
  <div class="nav-right">
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
<h1>⚙️ Settings</h1>

<div class="section profile">
<img src="https://i.pravatar.cc/100">
<h3 id="username">User</h3>
<button class="btn" onclick="changeName()">Edit Profile</button>
</div>

<div class="section" id="therapistLinkageSection" style="display:none;">
  <h3>👨‍⚕️ Speech Therapist Linkage</h3>
  <div id="linkedTherapistInfo" style="margin-bottom:12px; font-size:0.95rem; color:#94a3b8;">
    Current Therapist: <span id="therapistName" style="color:white; font-weight:600;">None linked</span>
  </div>
  <div id="linkForm" class="row" style="gap:10px;">
    <select id="therapistSelect" style="flex:1; padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.2); color:white; outline:none;">
      <option value="">Select a Therapist...</option>
    </select>
    <button class="btn" style="width:auto; margin:0; padding:8px 16px;" onclick="linkTherapist()">Link</button>
  </div>
  <div id="unlinkForm" style="display:none;">
    <button class="btn" style="background:#ef4444; color:white; margin:0; padding:8px 16px; width:auto;" onclick="unlinkTherapist()">Unlink Therapist</button>
  </div>
</div>

<div class="section">
<h3>📚 Learning</h3>
<div class="row"><span>Daily Goal</span><select id="goal"><option>5</option><option>10</option><option>15</option></select></div>
<div class="row"><span>Reminders</span><label class="switch"><input type="checkbox" id="rem"><span class="slider"></span></label></div>
</div>

<div class="section">
<h3>🎵 Audio</h3>
<div class="row"><span>Sound</span><label class="switch"><input type="checkbox" id="sound"><span class="slider"></span></label></div>
<div class="row"><span>Mic Sensitivity</span><input type="range" min="1" max="10" id="mic"></div>
</div>

<div class="section">
<h3>🎮 Game</h3>
<div class="row"><span>XP Boost</span><label class="switch"><input type="checkbox" id="xp"><span class="slider"></span></label></div>
<div class="row"><span>Streak Freeze</span><label class="switch"><input type="checkbox" id="freeze"><span class="slider"></span></label></div>
</div>

<div class="section">
<h3>🎨 Appearance</h3>
<div class="row"><span>Light Mode</span><label class="switch"><input type="checkbox" id="theme"><span class="slider"></span></label></div>
</div>

<div class="section">
<h3>🔒 Privacy</h3>
<div class="row"><span>Save Data</span><label class="switch"><input type="checkbox" id="save"><span class="slider"></span></label></div>
</div>

<div class="section">
<h3>⚠️ Reset</h3>
<button class="btn" onclick="resetData()">Reset App</button>
</div>

</div>

<div id="toast" class="toast">Saved!</div>

<script>
// Initialization
let token = localStorage.getItem('speechai_token');
if (!token) {
  window.location.href = 'index.html';
}

let settingsState = {
  daily_goal: 5,
  reminders: false,
  sound: true,
  mic_sensitivity: 5,
  xp_boost: false,
  streak_freeze: false,
  light_mode: false,
  save_data: true
};

async function loadSettings() {
  try {
    const res = await fetch('/users/me/settings', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      settingsState = await res.json();
      applySettingsToUI();
    }
  } catch (err) {
    console.error('Failed to load settings', err);
  }
}

async function loadProfile() {
  try {
    const res = await fetch('/auth/me', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('username').innerText = user.first_name || 'User';
      
      if (user.role === 'patient') {
        document.getElementById('therapistLinkageSection').style.display = 'block';
        loadLinkedTherapist();
        loadTherapistsList();
      }
    }
  } catch (err) {
    console.error('Failed to load profile', err);
  }
}

async function loadLinkedTherapist() {
  try {
    const res = await fetch('/users/me/therapist', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      const data = await res.json();
      const therapist = data.therapist;
      const infoSpan = document.getElementById('therapistName');
      const linkF = document.getElementById('linkForm');
      const unlinkF = document.getElementById('unlinkForm');
      
      if (therapist) {
        infoSpan.innerText = `${therapist.first_name || ''} ${therapist.last_name || ''} (${therapist.email})`;
        infoSpan.style.color = '#38bdf8';
        linkF.style.display = 'none';
        unlinkF.style.display = 'block';
      } else {
        infoSpan.innerText = 'None linked';
        infoSpan.style.color = '#94a3b8';
        linkF.style.display = 'flex';
        unlinkF.style.display = 'none';
      }
    }
  } catch (err) {
    console.error('Failed to load linked therapist', err);
  }
}

async function loadTherapistsList() {
  try {
    const res = await fetch('/users/therapists', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      const data = await res.json();
      const select = document.getElementById('therapistSelect');
      
      select.innerHTML = '<option value="">Select a Therapist...</option>';
      
      data.therapists.forEach(t => {
        const name = `${t.first_name || ''} ${t.last_name || ''}`.trim() || 'Unnamed Therapist';
        const opt = document.createElement('option');
        opt.value = t.email;
        opt.innerText = `${name} (${t.email})`;
        opt.style.background = '#1e293b';
        opt.style.color = 'white';
        select.appendChild(opt);
      });
    }
  } catch (err) {
    console.error('Failed to load therapists list', err);
  }
}

async function linkTherapist() {
  const email = document.getElementById('therapistSelect').value;
  if (!email) { alert('Please select a therapist.'); return; }
  
  try {
    const res = await fetch('/users/me/link-therapist', {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ therapist_email: email })
    });
    
    if (res.ok) {
      showToast();
      loadLinkedTherapist();
    } else {
      const err = await res.json();
      alert(err.detail || 'Failed to link therapist.');
    }
  } catch (err) {
    alert('Link request failed.');
  }
}

async function unlinkTherapist() {
  if (!confirm('Are you sure you want to unlink from your therapist?')) return;
  
  try {
    const res = await fetch('/users/me/link-therapist', {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      showToast();
      loadLinkedTherapist();
    } else {
      alert('Failed to unlink therapist.');
    }
  } catch (err) {
    alert('Unlink request failed.');
  }
}

function applySettingsToUI() {
  document.getElementById('goal').value = settingsState.daily_goal;
  document.getElementById('rem').checked = settingsState.reminders;
  document.getElementById('sound').checked = settingsState.sound;
  document.getElementById('mic').value = settingsState.mic_sensitivity;
  document.getElementById('xp').checked = settingsState.xp_boost;
  document.getElementById('freeze').checked = settingsState.streak_freeze;
  document.getElementById('theme').checked = settingsState.light_mode;
  document.getElementById('save').checked = settingsState.save_data;

  if (settingsState.light_mode) {
    document.body.classList.add('light');
  } else {
    document.body.classList.remove('light');
  }
}

async function saveSettings() {
  settingsState = {
    daily_goal: parseInt(document.getElementById('goal').value),
    reminders: document.getElementById('rem').checked,
    sound: document.getElementById('sound').checked,
    mic_sensitivity: parseInt(document.getElementById('mic').value),
    xp_boost: document.getElementById('xp').checked,
    streak_freeze: document.getElementById('freeze').checked,
    light_mode: document.getElementById('theme').checked,
    save_data: document.getElementById('save').checked
  };

  try {
    await fetch('/users/me/settings', {
      method: 'PUT',
      headers: { 
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(settingsState)
    });
    showToast();
    
    if (settingsState.light_mode) document.body.classList.add('light');
    else document.body.classList.remove('light');

  } catch (err) {
    console.error('Failed to save settings', err);
  }
}

// Bind events
let inputs = document.querySelectorAll('input,select:not(#therapistSelect)');
inputs.forEach(el => {
  el.onchange = saveSettings;
});

// Toast
function showToast() {
  let t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// Name
async function changeName() {
  let n = prompt('Enter name');
  if (n) {
    document.getElementById('username').innerText = n;
    localStorage.setItem('username', n);
    showToast();
    try {
      await fetch('/users/me/profile', {
        method: 'PUT',
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({first_name: n})
      });
    } catch (err) {
      console.error('Failed to save profile name', err);
    }
  }
}

// Reset
async function resetData() {
  if (confirm('Reset all data? This will permanently delete your session history!')) {
    try {
      await fetch('/users/me/data', {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      alert('Data reset successfully.');
      location.reload();
    } catch (err) {
      alert('Failed to reset data.');
    }
  }
}

function logout() {
  if (confirm('Are you sure you want to logout?')) {
    localStorage.removeItem('username');
    localStorage.removeItem('speechai_token');
    window.location.href = 'index.html';
  }
}

// Init
loadProfile();
loadSettings();
</script>

</body>
</html>
