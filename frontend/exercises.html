<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech AI Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:white}
.container{padding:25px;max-width:1200px;margin:auto}
h1{text-align:center;margin-bottom:20px}

.top-bar{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.stat{flex:1;background:rgba(255,255,255,0.05);padding:15px;border-radius:15px;text-align:center}
.stat h2{margin:5px 0;color:#38bdf8}

.exercise-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:rgba(255,255,255,0.05);padding:18px;border-radius:18px;text-align:center;transition:.3s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.btn{margin-top:10px;padding:10px;width:100%;border:none;border-radius:10px;background:#38bdf8;font-weight:600;cursor:pointer}

.recorder{text-align:center;margin-top:25px}
.mic-btn{width:70px;height:70px;border-radius:50%;border:none;background:red;color:white;font-size:20px;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,.6)}70%{box-shadow:0 0 0 20px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}
.score{margin-top:10px;font-size:18px;color:#38bdf8}

.progress-bar{height:10px;background:#1e293b;border-radius:10px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:#38bdf8;width:0%;transition:.3s}

.progress-section{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.chart-box{background:rgba(255,255,255,0.05);padding:15px;border-radius:15px}

.badges{margin-top:25px}
.badge-list{display:flex;gap:10px;flex-wrap:wrap}
.badge{padding:8px 12px;background:#1e293b;border-radius:10px;font-size:13px}
.badge.active{background:#38bdf8;color:black;font-weight:600}

/* GAME MODE */
.game-box{margin-top:25px;background:rgba(255,255,255,0.05);padding:20px;border-radius:15px;text-align:center}
.timer{font-size:20px;color:#facc15}

</style>
</head>
<body>

<div class="container">
<h1>🎮 Speech AI Game</h1>

<div class="top-bar">
<div class="stat"><p>🔥 Streak</p><h2 id="streak">0</h2></div>
<div class="stat"><p>🎯 Goal</p><h2 id="goal">0/5</h2></div>
<div class="stat"><p>⭐ Avg Score</p><h2 id="avg">0%</h2></div>
</div>

<div class="exercise-grid">
<div class="card"><h3>Basic</h3><button class="btn" onclick="startExercise('Hello World')">Start</button></div>
<div class="card"><h3>Fluency</h3><button class="btn" onclick="startExercise('How are you')">Start</button></div>
<div class="card"><h3>Advanced</h3><button class="btn" onclick="startExercise('AI is powerful')">Start</button></div>
<div class="card"><h3>Challenge</h3><button class="btn" onclick="startExercise('Machine learning improves speech')">Start</button></div>
</div>

<div class="game-box">
<h3>⚡ Speed Challenge Mode</h3>
<p>Speak before time runs out!</p>
<div class="timer" id="timer">Time: 10</div>
<button class="btn" onclick="startGameMode()">Start Game</button>
</div>

<div class="recorder">
<h2 id="targetText">Select Exercise</h2>
<button class="mic-btn" onclick="startRecording()">🎙</button>
<div class="score" id="score">Score: --</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="progress-section">
<div class="chart-box"><canvas id="progressChart"></canvas></div>
<div class="chart-box"><canvas id="accuracyChart"></canvas></div>
</div>

<div class="badges">
<h3>🏆 Achievements</h3>
<div class="badge-list">
<div class="badge" id="b1">First Try</div>
<div class="badge" id="b2">Score 80+</div>
<div class="badge" id="b3">5 Streak</div>
<div class="badge" id="b4">Fast Speaker</div>
</div>
</div>

</div>

<script>
let target='';
let scores=JSON.parse(localStorage.getItem('scores'))||[];
let attempts=scores.length;
let daily=JSON.parse(localStorage.getItem('daily'))||0;
let streak=JSON.parse(localStorage.getItem('streak'))||0;
let timeLeft=10;
let timerInterval;

function updateUI(){
document.getElementById('goal').innerText=daily+'/5';
document.getElementById('streak').innerText=streak;
document.getElementById('avg').innerText=avg()+'%';
}

function startExercise(text){
target=text.toLowerCase();
document.getElementById('targetText').innerText=text;
}

function startGameMode(){
startExercise(randomSentence());
timeLeft=10;
document.getElementById('timer').innerText='Time: '+timeLeft;
clearInterval(timerInterval);
timerInterval=setInterval(()=>{
timeLeft--;
document.getElementById('timer').innerText='Time: '+timeLeft;
if(timeLeft<=0){clearInterval(timerInterval);alert('⏰ Time Up!');}
},1000);
}

function randomSentence(){
const list=[
'practice makes perfect',
'speech ai is amazing',
'improving communication skills',
'confidence comes with practice'
];
return list[Math.floor(Math.random()*list.length)];
}

function startRecording(){
const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='en-US';rec.start();
rec.onresult=e=>{
let spoken=e.results[0][0].transcript.toLowerCase();
let s=calc(target,spoken);
scores.push(s);attempts++;daily++;
localStorage.setItem('scores',JSON.stringify(scores));
localStorage.setItem('daily',JSON.stringify(daily));

document.getElementById('score').innerText='Score: '+s+'%';
document.getElementById('progressFill').style.width=s+'%';
updateCharts();updateUI();checkBadges(s);

if(timeLeft>0) document.getElementById('b4').classList.add('active');
}
}

function calc(t,s){let m=0;for(let i=0;i<t.length;i++){if(t[i]===s[i])m++}return Math.floor((m/t.length)*100)}
function avg(){if(scores.length==0)return 0;return Math.floor(scores.reduce((a,b)=>a+b,0)/scores.length)}

let progressChart=new Chart(document.getElementById('progressChart'),{
type:'line',data:{labels:scores.map((_,i)=>'Try '+(i+1)),datasets:[{data:scores,label:'Progress'}]}
});
let accuracyChart=new Chart(document.getElementById('accuracyChart'),{
type:'bar',data:{labels:['Avg'],datasets:[{data:[avg()],label:'Score'}]}
});

function updateCharts(){
progressChart.data.labels.push('Try '+attempts);
progressChart.data.datasets[0].data.push(scores[scores.length-1]);
progressChart.update();
accuracyChart.data.datasets[0].data[0]=avg();
accuracyChart.update();
}

function checkBadges(s){
if(attempts>=1)document.getElementById('b1').classList.add('active');
if(s>=80)document.getElementById('b2').classList.add('active');
if(streak>=5)document.getElementById('b3').classList.add('active');
}

updateUI();
</script>

</body>
</html>
