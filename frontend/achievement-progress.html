<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements & Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:white}
.container{max-width:1150px;margin:auto;padding:25px}

h1{text-align:center;margin-bottom:25px;font-weight:700}

/* SUMMARY */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:25px}
.card{background:rgba(255,255,255,0.06);padding:18px;border-radius:16px;text-align:center;backdrop-filter:blur(8px);transition:.3s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.card h2{color:#38bdf8;margin-top:6px;font-size:22px}

/* LEVEL */
.level-box{background:rgba(255,255,255,0.06);padding:20px;border-radius:16px;margin-bottom:25px}
.level-header{display:flex;justify-content:space-between;align-items:center}
.progress-bar{height:12px;background:#1e293b;border-radius:10px;margin-top:12px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);width:0%;transition:.4s}

/* CHARTS */
.progress-section{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px;margin-bottom:30px}
.chart-box{background:rgba(255,255,255,0.06);padding:15px;border-radius:16px}
.small-chart{max-width:220px;margin:auto}

/* BADGES */
.badges{margin-top:20px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.badge{padding:14px;background:#1e293b;border-radius:12px;text-align:center;opacity:.4;transition:.3s;font-size:14px}
.badge.active{opacity:1;background:linear-gradient(135deg,#38bdf8,#22c55e);color:black;font-weight:600;transform:scale(1.05)}

/* TIMELINE */
.timeline{margin-top:30px}
.timeline-item{background:rgba(255,255,255,0.06);padding:14px;border-radius:12px;margin-bottom:10px;font-size:14px}

/* NAVBAR */
nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(15,23,42,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);z-index:1000}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:white;font-weight:600;font-size:1.1rem}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:#8fa5bc;font-size:0.9rem;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:#38bdf8}
.nav-right{display:flex;gap:15px;align-items:center}
.btn-logout{padding:8px 16px;background:transparent;border:1px solid #38bdf8;color:#38bdf8;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.btn-logout:hover{background:#38bdf8;color:#0f172a}
body{margin-top:60px}

<script src="js/i18n.js"></script>
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-brand">🎯 SpeechAI</a>
  <div class="nav-links">
    <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
    <a href="exercises.html" data-i18n="nav_exercises">Exercises</a>
    <a href="achievement-progress.html" class="active" data-i18n="nav_progress">Progress</a>
    <a href="settings.html" data-i18n="nav_settings">Settings</a>
  </div>
  <div class="nav-right">
    <button class="btn-logout" onclick="logout()" data-i18n="nav_logout">Logout</button>
  </div>
</nav>

<div class="container">
<h1>📊 Progress & Achievements</h1>

<div class="summary">
<div class="card"><p>Total Attempts</p><h2 id="attempts">0</h2></div>
<div class="card"><p>Average Score</p><h2 id="avg">0%</h2></div>
<div class="card"><p>Best Score</p><h2 id="best">0%</h2></div>
<div class="card"><p>Current Streak</p><h2 id="streak">0 🔥</h2></div>
</div>

<div class="summary" style="margin-top: -10px;">
<div class="card" style="background: rgba(56,189,248,0.08);"><p>🗣️ Avg Confidence</p><h2 id="avgConfidence">0%</h2></div>
<div class="card" style="background: rgba(239,68,68,0.08);"><p>💓 Avg Nervousness</p><h2 id="avgNervousness">0%</h2></div>
<div class="card" style="background: rgba(245,158,11,0.08);"><p>⏳ Avg Hesitation</p><h2 id="avgHesitation">0%</h2></div>
</div>

<div class="level-box">
<div class="level-header">
<h3>🎮 Level Progress</h3>
<span id="levelText">Level 1</span>
</div>
<div class="progress-bar"><div class="fill" id="levelFill"></div></div>
</div>

<div class="progress-section">
<div class="chart-box"><canvas id="progressChart"></canvas></div>
<div class="chart-box small-chart"><canvas id="performanceChart"></canvas></div>
<div class="chart-box small-chart"><canvas id="emotionChart"></canvas></div>
</div>

<div class="badges">
<h3>🏆 Achievements</h3>
<div class="badge-grid">
<div class="badge" id="b1">First Attempt</div>
<div class="badge" id="b2">Score 80+</div>
<div class="badge" id="b3">Score 90+</div>
<div class="badge" id="b4">5 Day Streak</div>
<div class="badge" id="b5">10 Attempts</div>
<div class="badge" id="b6">Pro Speaker</div>
</div>
</div>

<div class="timeline">
<h3>📅 Activity Timeline</h3>
<div id="timelineData"></div>
</div>

</div>

<script>
let token = localStorage.getItem('speechai_token');
if (!token) {
  window.location.href = 'index.html';
}

let scores = [];
let progressChart, performanceChart, emotionChart;

async function loadData() {
  const activeLang = localStorage.getItem('speechai_ui_lang') || 'english';
  try {
    // 1. Fetch Analytics
    const anaRes = await fetch(`/users/me/analytics?language=${activeLang}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (anaRes.ok) {
      const anaData = await anaRes.json();
      document.getElementById('attempts').innerText = anaData.total_attempts;
      document.getElementById('avg').innerText = anaData.average_score + '%';
      document.getElementById('best').innerText = anaData.best_score + '%';
      document.getElementById('streak').innerText = anaData.streak + ' 🔥';
      
      // Update new acoustic metrics
      document.getElementById('avgConfidence').innerText = (anaData.average_confidence || 0) + '%';
      document.getElementById('avgNervousness').innerText = (anaData.average_nervousness || 0) + '%';
      document.getElementById('avgHesitation').innerText = (anaData.average_hesitation || 0) + '%';
      
      scores = anaData.sessions.map(s => s.accuracy_score);
      
      loadTimeline(anaData.sessions);
      drawCharts(anaData.average_score, anaData.emotion_breakdown);
    }
    
    // 2. Fetch Gamification
    const gamRes = await fetch(`/users/me/gamification?language=${activeLang}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (gamRes.ok) {
      const gamData = await gamRes.json();
      const xp = gamData.xp;
      const level = gamData.level;
      const progressPct = gamData.progress_pct;
      
      document.getElementById('levelText').innerText = 'Level ' + level + ' (' + xp + ' XP)';
      document.getElementById('levelFill').style.width = progressPct + '%';
      
      applyBadges(gamData.badges);
    }
  } catch (err) {
    console.error('Failed to load progress data', err);
  }
}

function drawCharts(averageScore, emotionBreakdown) {
  if (progressChart) progressChart.destroy();
  if (performanceChart) performanceChart.destroy();
  if (emotionChart) emotionChart.destroy();

  progressChart = new Chart(document.getElementById('progressChart'), {
    type:'line',
    data:{labels:scores.map((_,i)=>'Try '+(i+1)),datasets:[{data:scores,label:'Score Progress', borderColor: '#38bdf8'}]},
    options:{plugins:{legend:{labels:{color:'white'}}},scales:{x:{ticks:{color:'white'}},y:{ticks:{color:'white'}}}}
  });

  performanceChart = new Chart(document.getElementById('performanceChart'), {
    type:'doughnut',
    data:{labels:['Avg','Remaining'],datasets:[{data:[averageScore, 100-averageScore], backgroundColor: ['#22c55e', '#1e293b']}]},
    options:{plugins:{legend:{labels:{color:'white'}}}}
  });
  
  // Prepare emotion chart data
  const emotionLabels = Object.keys(emotionBreakdown || {}).map(e => e.charAt(0).toUpperCase() + e.slice(1));
  const emotionCounts = Object.values(emotionBreakdown || {});
  const fallbackLabels = ['Neutral'];
  const fallbackCounts = [1];

  emotionChart = new Chart(document.getElementById('emotionChart'), {
    type:'doughnut',
    data:{
      labels: emotionLabels.length > 0 ? emotionLabels : fallbackLabels,
      datasets:[{
        data: emotionCounts.length > 0 ? emotionCounts : fallbackCounts,
        backgroundColor: ['#38bdf8', '#22c55e', '#f59e0b', '#ef4444', '#a855f7']
      }]
    },
    options:{
      plugins:{
        legend:{labels:{color:'white'}},
        title:{display:true, text:'Emotion Tone', color:'white'}
      }
    }
  });
}

function applyBadges(badgeIds) {
  // Reset all badges to inactive
  document.querySelectorAll('.badge').forEach(el => el.classList.remove('active'));
  // Activate unlocked ones
  badgeIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  });
}

function loadTimeline(sessions) {
  let container = document.getElementById('timelineData');
  container.innerHTML = '';
  sessions.slice(-5).reverse().forEach((s, i) => {
    let div = document.createElement('div');
    div.className = 'timeline-item';
    let dateStr = new Date(s.created_at).toLocaleDateString();
    
    let detailText = '';
    if (s.emotion) {
      const emotionText = s.emotion.charAt(0).toUpperCase() + s.emotion.slice(1);
      detailText = ` | Confidence: ${s.confidence_score || 0}% | Nervousness: ${s.nervousness_score || 0}% | Emotion: ${emotionText}`;
    }
    
    div.innerText = `${dateStr} → Attempt ${sessions.length - i} → Accuracy: ${s.accuracy_score}%${detailText}`;
    container.appendChild(div);
  });
}

function logout() {
  if(confirm(window.I18N_LOGOUT_CONFIRM || 'Are you sure you want to logout?')) {
    localStorage.removeItem('username');
    localStorage.removeItem('speechai_token');
    window.location.href = 'index.html';
  }
}

window.addEventListener("uiLanguageChanged", () => {
  loadData();
});

loadData();</script>

</body>
</html>
